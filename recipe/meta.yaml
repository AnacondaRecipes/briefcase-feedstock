{% set name = "briefcase" %}
{% set version = "0.4.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a9ea1c5e7603eba82c22a51694077a6b96e3335756dee61a994ad64e091372c3

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - briefcase = briefcase.__main__:main

requirements:
  host:
    - python
    - pip
    - setuptools ==84.0.0
    - setuptools-scm ==10.3.4
  run:
    - python
    # briefcase uses pip/setuptools/wheel at runtime to package user apps
    - packaging >=24.2
    - pip >=26.2.2
    - setuptools >=60
    - wheel >=0.37
    - xbuild >=0.4.0
    - cookiecutter >=2.6.0,<3.0
    # Upstream pins chardet <8.0 due to requests runtime warning (psf/requests#7219)
    - chardet <8.0
    - dmgbuild >=1.6.4,<2.0  # [osx]
    - gitpython >=3.1,<4.0
    - platformdirs >=2.6,<5.0
    - psutil >=5.9,<8.0
    - python-dateutil >=2.9.0.post0
    - httpx2 >=2.13,<3.0
    - rich >=12.6,<16.0
    - tenacity >=9.2.0,<10.0
    - tomli-w >=1.0,<2.0

# Windows/ARM64: briefcase cannot auto-install the Android SDK (Google ships no arm64
# cmdline-tools) and builds WiX MSIs with `-arch arm64` / Visual Studio output under ARM64/
# instead of x64/, so the upstream tests hard-coding the x86_64 equivalents cannot pass.
{% set deselect_tests = "" %}
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_download_sdk' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_download_sdk_legacy_install' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_download_sdk_if_sdkmanager_not_executable' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_upgrade_existing_sdk' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_raises_networkfailure_on_connectionerror' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_verify.py::test_detects_bad_zipfile' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/integrations/android_sdk/AndroidSDK/test_select_target_device.py::test_auto_non_existent' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect "tests/platforms/windows/app/test_package.py::test_package_msi[kwargs0-False]"' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect "tests/platforms/windows/app/test_package.py::test_package_msi[kwargs1-True]"' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect "tests/platforms/windows/app/test_package.py::test_package_msi[kwargs2-False]"' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect "tests/platforms/windows/app/test_package.py::test_package_msi_with_codesigning[False-additional_args0]"' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect "tests/platforms/windows/app/test_package.py::test_package_msi_with_codesigning[True-additional_args1]"' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/app/test_package.py::test_package_msi_failed_compile' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/app/test_package.py::test_package_msi_failed_signing_msi' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_create.py::test_package_path' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_mixin.py::test_binary_path' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_package.py::test_package_msi' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_run.py::test_run_app' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_run.py::test_run_app_with_args' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_run.py::test_run_app_test_mode' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_run.py::test_run_app_test_mode_with_args' %}  # [win and arm64]
{% set deselect_tests = deselect_tests + ' --deselect tests/platforms/windows/visualstudio/test_run.py::test_run_app_debugger' %}  # [win and arm64]

test:
  source_files:
    - tests
  imports:
    - briefcase
    - briefcase.bootstraps
    - briefcase.channels
    - briefcase.commands
    - briefcase.integrations
    - briefcase.platforms
  commands:
    - pip check
    - briefcase --version
    # briefcase deliberately refuses to auto-install the Android SDK on Linux/aarch64
    # (Google ships no arm64 linux cmdline-tools), so its download-path tests cannot pass there
    - pytest -vv tests -k "not (download_sdk or upgrade_existing_sdk or networkfailure_on_connectionerror or detects_bad_zipfile)"  # [linux and aarch64]
    - pytest -vv tests{{ deselect_tests }}  # [not (linux and aarch64)]
  requires:
    - pip
    - pytest
    - git

about:
  home: https://briefcase.beeware.org/
  summary: Tools to support converting a Python project into a standalone native application.
  description: |
    Briefcase is a tool for converting a Python project into a standalone native
    application. It supports packaging for macOS, Windows, Linux, iOS, Android,
    and the web.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/beeware/briefcase
  doc_url: https://briefcase.beeware.org/

extra:
  skip-lints:
    - python_build_tools_in_host
  recipe-maintainers:
    - cbouss
